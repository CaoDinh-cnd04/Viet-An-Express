name: CI

# CD không nằm ở đây: build bằng backend/scripts/publish-ftp.ps1 rồi đẩy lên hosting IIS qua FTP
# (xem backend/scripts/iis/HUONG_DAN_IIS.md).

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

# Push mới vào cùng nhánh thì huỷ lần chạy cũ đang dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Frontend: kiểm tra kiểu, test, build (web/) ----------
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22          # Vite 8 cần Node ≥ 20.19
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ---------- Backend: build + toàn bộ test, kể cả test cần SQL Server ----------
  backend:
    name: Backend — build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      # SQL Server tạm cho test tích hợp (test tự tạo DB vietan_tests_xxx rồi xoá).
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Only_Pa55word!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_Pa55word!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Mật khẩu chỉ dùng cho SQL Server tạm trong CI (bị huỷ sau job), không phải database thật.
      VIETAN_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci_Only_Pa55word!;Encrypt=True;TrustServerCertificate=True"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore VietAnExpress.slnx

      - name: Build
        run: dotnet build VietAnExpress.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution VietAnExpress.slnx -c Release --no-build

      # Hai ứng dụng build độc lập, nhưng phải dùng cùng bộ dữ liệu quốc gia EU.
      - name: Check EU country data matches web
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          web = json.loads(Path('../web/src/shared/config/eu-countries.json').read_text(encoding='utf-8'))
          api = json.loads(Path('src/Modules/Shipments/VietAnExpress.Shipments/Shared/eu-countries.json').read_text(encoding='utf-8'))
          assert web == api, 'EU country data differs between web and backend'
          PY
