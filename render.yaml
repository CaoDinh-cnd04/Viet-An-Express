# Backend .NET 10; frontend triển khai riêng trên Vercel (Root Directory: web).
services:
  - type: web
    name: vietan-express-api
    runtime: docker
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__SecureCookies
        value: "true"
      - key: Database__MigrateOnStartup
        value: "false"
      - key: Company__PortalUrl
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Shopify__ClientId
        sync: false
      - key: Shopify__ClientSecret
        sync: false
      - key: Ecommerce__TokenEncryptionKey
        sync: false
      - key: Email__UserName
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__InboxAddress
        sync: false
